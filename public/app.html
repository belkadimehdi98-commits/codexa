<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codexa AI App</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <!-- Navbar -->
  <header class="navbar">
    <img src="logo.png" alt="Codexa Logo" class="logo">
    <h1>Codexa AI</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="index.html#features">Features</a>
      <a href="index.html#pricing">Pricing</a>
    </nav>
  </header>

  <!-- Chat Box -->
  <main class="chat-container">
    <div class="chat-box" id="chat-box"></div>
    <div class="chat-input">
      <input type="text" id="user-input" placeholder="Type your message...">
      <button onclick="sendMessage()">Chat</button>
      <button onclick="generateCode()">Generate Code</button>
    </div>
    <div class="chat-actions">
      <button onclick="copyChat()">Copy</button>
      <button onclick="downloadChat()">Download</button>
      <button onclick="exportChat()">Export Chat</button>
      <button onclick="resetChat()">Reset</button>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>© 2025 Codexa AI. All rights reserved.</p>
  </footer>
</body>
</html>
