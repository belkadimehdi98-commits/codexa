<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Codexa AI — Generator</title>
  <link rel="icon" href="/logo.png"/>
  <link rel="stylesheet" href="/style.css"/>
  <link rel="manifest" href="/manifest.json"/>
  <script>
    function toggleTheme(){
      const r=document.documentElement; const cur=r.getAttribute('data-theme')||'dark';
      const next = cur==='dark'?'light':'dark'; r.setAttribute('data-theme',next); localStorage.setItem('theme',next);
    }
    document.addEventListener('DOMContentLoaded',()=>{const s=localStorage.getItem('theme'); if(s) document.documentElement.setAttribute('data-theme',s);});
    async function checkout(key){
      try{
        const r=await fetch('/create-checkout-session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({priceId:key})});
        const d=await r.json(); if(d?.url) location.href=d.url; else alert(d?.error||'Something went wrong.');
      }catch{alert('Network error');}
    }
  </script>
</head>
<body class="app-wrap">
  <header class="nav">
    <div class="nav-left">
      <img src="/logo.png" class="logo" alt="Codexa"/>
      <a class="brand" href="/">Codexa AI</a>
    </div>
    <nav class="nav-links">
      <a href="/">Home</a>
      <a href="/tutorial.html">Tutorial</a>
      <button class="btn-ghost" onclick="toggleTheme()" aria-label="Toggle theme">🌓</button>
    </nav>
  </header>

  <div class="app-banner">
    <div class="badge">Free trial: <span id="left">10</span>/<span id="limit">10</span> left</div>
    <div style="display:flex;gap:8px">
      <button class="btn-soft small" onclick="checkout('PRICE_PRO')">Upgrade</button>
      <button class="btn-soft small" onclick="checkout('PRICE_TEAM')">Team</button>
    </div>
  </div>

  <main class="chat-shell">
    <!-- Toolbar -->
    <div class="toolbar">
      <button class="btn-soft small" onclick="copyChat()">Copy</button>
      <button class="btn-soft small" onclick="downloadChat()">Download</button>
      <button class="btn-soft small" onclick="exportChat()">Export</button>
      <button class="btn-danger small" onclick="resetChat()">Reset</button>
    </div>

    <!-- Chat feed (scrolls independently) -->
    <div id="chat" class="chat-scroll" aria-live="polite">
      <div class="msg ai">
        <div class="avatar"><img src="/logo.png" alt="" class="logo" style="width:100%;height:100%;border-radius:50%"></div>
        <div class="bubble">Hello! I’m Codexa AI. Tell me what you want to build — I’ll guide you and generate clean code when you’re ready.</div>
      </div>
    </div>

    <!-- Composer -->
    <form class="composer" onsubmit="return sendChat(event)">
      <input id="input" type="text" placeholder="Type your message… (Enter = send, Shift+Enter = newline)" autocomplete="off"/>
      <button id="sendBtn" class="btn-primary" type="submit">Chat</button>
      <button class="btn-purple" type="button" onclick="generateCode()">Generate Code</button>
    </form>
  </main>

  <footer class="footer">© 2025 Codexa — Crafted with Precision. • <a href="/privacy.html">Privacy</a> • <a href="/terms.html">Terms</a> • <a href="/about.html">About</a></footer>

  <script>
    /* Trial badge (client cue) */
    const LIMIT=10; function getCount(){return +localStorage.getItem('genCount')||0;} function setCount(v){localStorage.setItem('genCount',v);}
    function paintUsage(){document.getElementById('left').textContent = Math.max(0, LIMIT - Math.min(getCount(), LIMIT)); document.getElementById('limit').textContent = LIMIT;}
    paintUsage();

    const chatEl=document.getElementById('chat'); const inputEl=document.getElementById('input');

    function append(role, text){
      const wrap=document.createElement('div'); wrap.className='msg '+(role==='assistant'?'ai':'user');
      const av=document.createElement('div'); av.className='avatar'; av.textContent = role==='assistant'?'C':'You';
      if(role==='assistant'){ av.innerHTML = '<img src="/logo.png" class="logo" style="width:100%;height:100%;border-radius:50%"/>'; }
      const bubble=document.createElement('div'); bubble.className='bubble'; bubble.textContent=text;
      if(role==='user'){ wrap.append(bubble); wrap.append(av); }
      else{ wrap.append(av); wrap.append(bubble); }
      chatEl.appendChild(wrap); chatEl.scrollTop=chatEl.scrollHeight; return bubble;
    }

    function copyChat(){
      const txt=[...document.querySelectorAll('#chat .bubble')].map(b=>b.textContent).join('\n\n');
      navigator.clipboard.writeText(txt);
    }
    function downloadChat(){
      const txt=[...document.querySelectorAll('#chat .bubble')].map(b=>b.textContent).join('\n\n');
      const blob=new Blob([txt],{type:'text/plain'}); const url=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download='codexa-chat.txt'; a.click(); URL.revokeObjectURL(url);
    }
    function exportChat(){
      const msgs=[...document.querySelectorAll('#chat .msg')].map(m=>({role:m.classList.contains('ai')?'assistant':'user',content:m.querySelector('.bubble')?.textContent||''}));
      const blob=new Blob([JSON.stringify(msgs,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download='codexa-history.json'; a.click(); URL.revokeObjectURL(url);
    }
    function resetChat(){ chatEl.innerHTML=''; append('assistant','New session started. What shall we build?'); }

    async function sendChat(e){
      e.preventDefault();
      const msg=inputEl.value.trim(); if(!msg) return false;
      append('user', msg); inputEl.value='';

      const bubble=append('assistant','typing…');
      const src = new EventSource(`/chat-stream?prompt=${encodeURIComponent(msg)}`);
      let full='';
      src.onmessage = (ev)=>{
        try{
          const data=JSON.parse(ev.data);
          if(data.token){ full+=data.token; bubble.textContent=full; chatEl.scrollTop=chatEl.scrollHeight; }
          if(data.error){ bubble.textContent='Sorry — '+data.error; src.close(); }
        }catch{}
      };
      src.addEventListener('done',()=>src.close());
      src.onerror = ()=>{ bubble.textContent='Connection issue. Please try again.'; src.close(); };
      return false;
    }

    function generateCode(){
      const base = inputEl.value.trim() || 'Create a responsive landing page with a hero, features grid, and CTA.';
      inputEl.value = base + ' Return a SINGLE HTML file with inline CSS & JS only.';
      setCount(Math.min(LIMIT, getCount()+1)); paintUsage();
      document.getElementById('sendBtn').click();
    }

    // keyboard: Enter send / Shift+Enter newline
    inputEl.addEventListener('keydown', (e)=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); document.getElementById('sendBtn').click(); }});
  </script>
</body>
</html>
