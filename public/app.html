<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codexa AI App</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- Navbar -->
  <header class="navbar">
    <div class="logo-container">
      <img src="/logo.png" alt="Codexa Logo" class="logo" />
      <span class="brand">Codexa AI</span>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="features.html">Features</a>
      <a href="pricing.html">Pricing</a>
    </nav>
  </header>

  <!-- Chat App -->
  <main class="chat-container">
    <div id="chat-box" class="chat-box"></div>
    <div class="chat-input-container">
      <input type="text" id="user-input" placeholder="Type your message..." />
      <button id="send-btn" class="btn-primary">Chat</button>
      <button id="generate-btn" class="btn-secondary">Generate Code</button>
    </div>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
