<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codexa AI App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Navbar -->
  <header class="navbar">
    <div class="logo">
      <img src="logo.png" alt="Codexa Logo">
      <span>Codexa AI</span>
    </div>
    <nav id="menu">
      <a href="index.html">Home</a>
      <a href="features.html">Features</a>
      <a href="pricing.html">Pricing</a>
      <a href="app.html">Open App</a>
    </nav>
    <div class="hamburger" onclick="toggleMenu()">☰</div>
  </header>

  <!-- Chat/Code Generator -->
  <main class="chat-container">
    <div id="chat-box">
      <div class="bot-message">Hello! How can I assist you today?</div>
    </div>

    <div class="chat-input">
      <textarea id="user-input" placeholder="Type your message..."></textarea>
      <div class="sticky-buttons">
        <button class="btn chat-btn" onclick="sendMessage()">Chat</button>
        <button class="btn code-btn" onclick="generateCode()">Generate Code</button>
      </div>
    </div>

    <div class="extra-actions">
      <button onclick="copyCode()">Copy</button>
      <button onclick="downloadCode()">Download</button>
      <button onclick="exportChat()">Export Chat</button>
      <button onclick="resetChat()">Reset</button>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>Powered by Codexa AI</p>
  </footer>

  <script src="app.js"></script>
  <script>
    function toggleMenu() {
      document.getElementById("menu").classList.toggle("active");
    }
  </script>
</body>
</html>
