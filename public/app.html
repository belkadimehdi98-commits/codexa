<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codexa AI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #0d1117;
      color: #fff;
    }
    header {
      padding: 1rem;
      background: #161b22;
      font-size: 1.5rem;
      font-weight: bold;
      text-align: center;
    }
    nav {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 1rem;
    }
    nav button {
      background: #1f2937;
      color: #fff;
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }
    nav button.active {
      background: #3b82f6;
    }
    main {
      text-align: center;
      padding: 2rem;
    }
    textarea {
      width: 60%;
      height: 100px;
      margin: 1rem 0;
      border-radius: 8px;
      padding: 1rem;
      font-size: 1rem;
      border: none;
      outline: none;
      resize: vertical;
      background: #161b22;
      color: #fff;
    }
    .btn {
      padding: 0.8rem 1.6rem;
      margin: 0.5rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-blue { background: #3b82f6; color: #fff; }
    .btn-green { background: #22c55e; color: #fff; }
    .btn-purple { background: #a855f7; color: #fff; }
    pre, .chat-output {
      text-align: left;
      background: #161b22;
      padding: 1rem;
      border-radius: 6px;
      margin: 1rem auto;
      width: 80%;
      overflow-x: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .history {
      margin-top: 2rem;
      text-align: left;
      width: 80%;
      margin-left: auto;
      margin-right: auto;
    }
    .history-item {
      background: #1e2633;
      padding: 1rem;
      border-radius: 6px;
      margin-bottom: 1rem;
    }
    footer {
      margin-top: 3rem;
      padding: 1rem;
      background: #161b22;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>⚡ Codexa AI</header>

  <nav>
    <button id="tabCode" class="active">💻 Generate Code</button>
    <button id="tabChat">💬 Chat with AI</button>
  </nav>

  <main>
    <div id="codeSection">
      <textarea id="codePrompt" placeholder="Describe your site idea..."></textarea><br>
      <button id="generateBtn" class="btn btn-blue">⚡ Generate Website Code</button>
      <div id="status"></div>
      <div id="result" style="display:none;">
        <h3>✅ Done!</h3>
        <pre id="codeOutput"></pre>
        <button class="btn-green" onclick="copyCode()">Copy</button>
        <button class="btn-purple" onclick="downloadCode()">Download</button>
      </div>
    </div>

    <div id="chatSection" style="display:none;">
      <textarea id="chatPrompt" placeholder="Ask me anything..."></textarea><br>
      <button id="chatBtn" class="btn btn-blue">💬 Send</button>
      <div id="chatOutput" class="chat-output"></div>
    </div>

    <section class="history">
      <h2>📂 History</h2>
      <div id="historyList"></div>
      <button onclick="exportHistory()">Export History</button>
      <button onclick="clearHistory()">Clear History</button>
    </section>
  </main>

  <footer>© 2025 Codexa. All rights reserved.</footer>

  <script>
    // Tab switching
    document.getElementById("tabCode").addEventListener("click", () => {
      document.getElementById("codeSection").style.display = "block";
      document.getElementById("chatSection").style.display = "none";
      document.getElementById("tabCode").classList.add("active");
      document.getElementById("tabChat").classList.remove("active");
    });
    document.getElementById("tabChat").addEventListener("click", () => {
      document.getElementById("codeSection").style.display = "none";
      document.getElementById("chatSection").style.display = "block";
      document.getElementById("tabChat").classList.add("active");
      document.getElementById("tabCode").classList.remove("active");
    });

    let generatedCode = "";

    function copyCode() {
      navigator.clipboard.writeText(generatedCode).then(() => alert("Code copied!"));
    }
    function downloadCode() {
      const blob = new Blob([generatedCode], { type: "text/html" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "index.html";
      a.click();
      URL.revokeObjectURL(url);
    }

    function saveHistory(type, prompt, output) {
      let history = JSON.parse(localStorage.getItem("history") || "[]");
      history.push({ type, prompt, output, time: new Date().toLocaleString() });
      localStorage.setItem("history", JSON.stringify(history));
      renderHistory();
    }
    function renderHistory() {
      let history = JSON.parse(localStorage.getItem("history") || "[]");
      const list = document.getElementById("historyList");
      list.innerHTML = "";
      history.forEach((item, i) => {
        const div = document.createElement("div");
        div.className = "history-item";
        div.innerHTML = `
          <b>${item.type}</b> | <small>${item.time}</small><br>
          <i>${item.prompt}</i><br>
          <button class="btn-blue" onclick="loadHistory(${i})">Load</button>
        `;
        list.appendChild(div);
      });
    }
    function loadHistory(i) {
      let history = JSON.parse(localStorage.getItem("history") || "[]");
      if (!history[i]) return;
      if (history[i].type === "code") {
        document.getElementById("codeOutput").innerText = history[i].output;
        document.getElementById("result").style.display = "block";
      } else {
        document.getElementById("chatOutput").innerText = history[i].output;
      }
    }
    function exportHistory() {
      let history = localStorage.getItem("history");
      const blob = new Blob([history], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "codexa-history.json";
      a.click();
      URL.revokeObjectURL(url);
    }
    function clearHistory() {
      localStorage.removeItem("history");
      renderHistory();
    }

    // Code generator
    document.getElementById("generateBtn").addEventListener("click", async () => {
      const prompt = document.getElementById("codePrompt").value.trim();
      if (!prompt) return alert("Enter a prompt first!");
      document.getElementById("status").innerText = "⏳ Generating...";
      try {
        const r = await fetch("/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt, mode: "code" })
        });
        const data = await r.json();
        generatedCode = data.code || "";
        document.getElementById("codeOutput").innerText = generatedCode;
        document.getElementById("result").style.display = "block";
        document.getElementById("status").innerText = "✅ Done!";
        saveHistory("code", prompt, generatedCode);
      } catch (e) {
        document.getElementById("status").innerText = "❌ Error: " + e.message;
      }
    });

    // AI chat
    document.getElementById("chatBtn").addEventListener("click", async () => {
      const prompt = document.getElementById("chatPrompt").value.trim();
      if (!prompt) return alert("Enter a message first!");
      document.getElementById("chatOutput").innerText = "⏳ Thinking...";
      try {
        const r = await fetch("/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt, mode: "chat" })
        });
        const data = await r.json();
        document.getElementById("chatOutput").innerText = data.code || data.error || "No response";
        saveHistory("chat", prompt, data.code);
      } catch (e) {
        document.getElementById("chatOutput").innerText = "❌ Error: " + e.message;
      }
    });

    renderHistory();
  </script>
</body>
</html>
