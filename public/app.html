<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codexa AI App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="navbar">
    <div class="logo">
      <img src="codexa-logo.png" alt="Codexa Logo" class="logo-img" />
      <span>Codexa AI</span>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="index.html#features">Features</a>
      <a href="index.html#pricing">Pricing</a>
    </nav>
  </header>

  <main class="chat-container">
    <div id="chat-box" class="chat-box"></div>

    <div class="chat-controls">
      <textarea id="user-input" placeholder="Type your message..." rows="1"></textarea>
      <button id="send-btn" class="btn-primary">Chat</button>
      <button id="gen-btn" class="btn-secondary">Generate Code</button>
    </div>

    <div class="utility-buttons">
      <button onclick="copyChat()">Copy</button>
      <button onclick="downloadChat()">Download</button>
      <button onclick="exportChat()">Export Chat</button>
      <button onclick="resetChat()">Reset</button>
    </div>
  </main>

  <footer>
    <p>© 2025 Codexa AI. All rights reserved.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
