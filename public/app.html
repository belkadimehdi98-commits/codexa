<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codexa AI Generator</title>
  <style>
    body { font-family: Arial, sans-serif; margin:0; background:#0d1117; color:#fff; display:flex; flex-direction:column; height:100vh; }
    header { background:#161b22; padding:1rem; display:flex; align-items:center; justify-content:space-between; }
    header img { height:35px; }
    header nav a { color:#fff; margin-left:1.5rem; text-decoration:none; }
    #chat { flex:1; overflow-y:auto; padding:1rem; }
    .msg { max-width:70%; margin:0.5rem; padding:0.8rem 1rem; border-radius:8px; line-height:1.5; }
    .msg.user { background:#2563eb; margin-left:auto; text-align:right; }
    .msg.ai { background:#1e2633; margin-right:auto; text-align:left; }
    .msg pre { background:#0d1117; padding:0.8rem; border-radius:6px; overflow-x:auto; white-space:pre-wrap; word-wrap:break-word; }
    .typing { color:#aaa; font-style:italic; }
    footer { background:#161b22; padding:1rem; display:flex; align-items:center; gap:0.5rem; }
    #prompt { flex:1; padding:0.8rem; border-radius:6px; border:none; background:#1e2633; color:#fff; }
    button { padding:0.6rem 1rem; border:none; border-radius:6px; cursor:pointer; font-weight:bold; }
    .btn-blue { background:#3b82f6; color:#fff; }
    .btn-green { background:#22c55e; color:#fff; }
    .floating { position:fixed; bottom:90px; right:20px; display:none; }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Codexa Logo">
    <nav>
      <a href="/tutorial.html">Tutorial</a>
    </nav>
  </header>

  <div id="chat"></div>

  <footer>
    <input id="prompt" placeholder="Type your message..." />
    <button id="sendBtn" class="btn-blue">💬 Chat</button>
  </footer>

  <button id="generateBtn" class="btn-green floating">💻 Generate Code</button>

  <script>
    const chatDiv = document.getElementById("chat");
    const promptInput = document.getElementById("prompt");
    const sendBtn = document.getElementById("sendBtn");
    const generateBtn = document.getElementById("generateBtn");
    let lastMessage = "";

    function addMessage(text, sender="ai", isCode=false) {
      const msgDiv = document.createElement("div");
      msgDiv.className = `msg ${sender}`;
      if (isCode) {
        msgDiv.innerHTML = `
          <pre>${text}</pre>
          <div style="margin-top:5px;">
            <button onclick="navigator.clipboard.writeText(\`${text}\`)">📋 Copy</button>
            <button onclick="downloadGenerated('${Date.now()}', \`${text}\`)">⬇️ Download</button>
          </div>
        `;
      } else {
        msgDiv.textContent = text;
      }
      chatDiv.appendChild(msgDiv);
      chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    function showTyping() {
      const typingDiv = document.createElement("div");
      typingDiv.className = "msg ai typing";
      typingDiv.id = "typing";
      typingDiv.textContent = "AI is typing...";
      chatDiv.appendChild(typingDiv);
      chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    function removeTyping() {
      const t = document.getElementById("typing");
      if (t) t.remove();
    }

    function downloadGenerated(name, content) {
      const blob = new Blob([content], { type:"text/html" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${name}.html`;
      a.click();
      URL.revokeObjectURL(url);
    }

    async function streamChat(prompt) {
      addMessage(prompt, "user");
      showTyping();

      const aiDiv = document.createElement("div");
      aiDiv.className = "msg ai";
      aiDiv.innerHTML = "";
      chatDiv.appendChild(aiDiv);

      let msg = "";
      const evtSource = new EventSource(`/chat-stream?prompt=${encodeURIComponent(prompt)}`);

      evtSource.onmessage = (event) => {
        removeTyping();
        const data = JSON.parse(event.data);
        if (data.token) {
          msg += data.token;
          aiDiv.innerHTML = msg;
          chatDiv.scrollTop = chatDiv.scrollHeight;
        }
      };

      evtSource.addEventListener("done", () => {
        evtSource.close();
        lastMessage = msg;
        if (msg.includes("<html") || msg.includes("<!DOCTYPE") || msg.includes("function")) {
          generateBtn.style.display = "inline-block";
          addMessage("👉 Tip: Click '💻 Generate Code' to save this file.", "ai");
        }
      });

      evtSource.onerror = () => evtSource.close();
    }

    sendBtn.onclick = () => {
      const prompt = promptInput.value.trim();
      if (!prompt) return;
      promptInput.value = "";
      streamChat(prompt);
    };

    generateBtn.onclick = () => {
      if (lastMessage) {
        addMessage(lastMessage, "ai", true);
        generateBtn.style.display = "none";
      }
    };
  </script>
</body>
</html>
