<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codexa AI</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: #fff;
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #161b22;
    }

    header h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
    }

    .message {
      margin: 0.5rem 0;
      padding: 0.75rem;
      border-radius: 8px;
      max-width: 80%;
    }

    .user {
      background: #1f6feb;
      color: #fff;
      margin-left: auto;
    }

    .ai {
      background: #21262d;
      color: #ddd;
      margin-right: auto;
    }

    #chat-bar {
      background: #161b22;
      padding: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-top: 1px solid #30363d;
    }

    #user-input {
      flex: 1;
      padding: 0.6rem;
      border-radius: 6px;
      border: none;
      outline: none;
      font-size: 1rem;
    }

    button {
      border: none;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
    }

    #chat-btn {
      background: #238636;
      color: #fff;
    }

    #chat-btn:hover {
      background: #2ea043;
    }
  </style>
</head>
<body>
  <header>
    <h1>⚡ Codexa AI</h1>
    <nav>
      <a href="index.html" style="color:#fff; margin-right:1rem;">Home</a>
      <a href="tutorial.html" style="color:#fff;">Tutorial</a>
    </nav>
  </header>

  <main id="chat-container"></main>

  <div id="chat-bar">
    <input type="text" id="user-input" placeholder="Type your message..." />
    <button id="chat-btn">💬 Chat</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
