<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codexa AI App</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <nav class="navbar">
      <img src="/assets/codexa-logo.png" alt="Codexa Logo" class="logo" />
      <span class="brand">Codexa AI</span>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/#features">Features</a></li>
        <li><a href="/#pricing">Pricing</a></li>
      </ul>
    </nav>
  </header>

  <main class="chat-container">
    <div id="chat-box"></div>
    <div class="chat-controls">
      <input type="text" id="user-input" placeholder="Type your message..." />
      <button id="chat-btn" class="btn-secondary">Chat</button>
      <button id="generate-btn" class="btn-primary">Generate Code</button>
    </div>
    <div class="export-buttons">
      <button id="copy-btn">Copy</button>
      <button id="download-btn">Download</button>
      <button id="export-btn">Export Chat</button>
      <button id="reset-btn">Reset</button>
    </div>
  </main>

  <footer>
    <p>© 2025 Codexa AI. All rights reserved.</p>
  </footer>

  <script src="/script.js"></script>
</body>
</html>
