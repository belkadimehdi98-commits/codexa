<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Codexa AI</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: #161b22;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header img {
      height: 40px;
    }
    .chat-container {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
    }
    .message {
      margin: 0.8rem 0;
      padding: 0.8rem 1rem;
      border-radius: 8px;
      max-width: 70%;
      line-height: 1.4;
    }
    .user {
      background: #3b82f6;
      margin-left: auto;
    }
    .bot {
      background: #1e2633;
      margin-right: auto;
    }
    .input-bar {
      display: flex;
      padding: 1rem;
      background: #161b22;
    }
    .input-bar input {
      flex: 1;
      padding: 0.8rem;
      border: none;
      border-radius: 6px;
      outline: none;
      background: #0d1117;
      color: #fff;
    }
    .input-bar button {
      margin-left: 0.8rem;
      padding: 0.8rem 1.2rem;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-blue { background: #3b82f6; color: #fff; }
    .btn-green { background: #22c55e; color: #fff; }
    .btn-purple { background: #a855f7; color: #fff; }
    pre {
      background: #000;
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
      white-space: pre-wrap;
      margin-top: 1rem;
    }
    footer {
      background: #161b22;
      text-align: center;
      padding: 1rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Codexa Logo">
    <strong>⚡ Build Smarter with Codexa</strong>
  </header>

  <div class="chat-container" id="chat"></div>

  <div id="codeSection" style="display:none; padding:1rem; background:#0d1117;">
    <h3>💻 Generated Code</h3>
    <pre id="codeOutput"></pre>
    <button class="btn-green" onclick="copyCode()">Copy</button>
    <button class="btn-purple" onclick="downloadCode()">Download</button>
  </div>

  <div class="input-bar">
    <input type="text" id="userInput" placeholder="Type your message..."/>
    <button class="btn-blue" onclick="sendMessage()">Send</button>
    <button id="genBtn" class="btn-green" style="display:none;" onclick="generateCode()">Generate Code</button>
  </div>

  <footer>© 2025 Codexa. All rights reserved.</footer>

  <script>
    const chatBox = document.getElementById("chat");
    const userInput = document.getElementById("userInput");
    const genBtn = document.getElementById("genBtn");
    const codeSection = document.getElementById("codeSection");
    const codeOutput = document.getElementById("codeOutput");
    let lastPrompt = "";
    let generatedCode = "";

    function addMessage(content, sender="bot") {
      const div = document.createElement("div");
      div.className = "message " + sender;
      div.innerText = content;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;
      addMessage(text, "user");
      lastPrompt = text;
      userInput.value = "";

      addMessage("⏳ Thinking...", "bot");
      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: text })
        });
        const data = await res.json();
        chatBox.lastChild.innerText = data.reply || "❌ Error.";
        // If AI detects it's about building a site, show Generate button
        if (/site|website|page|code|html|css|javascript/i.test(text)) {
          genBtn.style.display = "inline-block";
        }
      } catch (err) {
        chatBox.lastChild.innerText = "❌ Server error: " + err.message;
      }
    }

    async function generateCode() {
      if (!lastPrompt) {
        alert("Please describe what you want first!");
        return;
      }
      addMessage("⏳ Generating code for: " + lastPrompt, "bot");
      try {
        const res = await fetch("/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: lastPrompt })
        });
        const data = await res.json();
        if (data.code) {
          generatedCode = data.code;
          codeOutput.innerText = data.code;
          codeSection.style.display = "block";
          addMessage("✅ Code ready! Scroll down to see it.", "bot");
        } else {
          addMessage("❌ Error generating code.", "bot");
        }
      } catch (err) {
        addMessage("❌ Server error: " + err.message, "bot");
      }
    }

    function copyCode() {
      navigator.clipboard.writeText(generatedCode).then(() => {
        alert("Code copied!");
      });
    }

    function downloadCode() {
      const blob = new Blob([generatedCode], { type: "text/html" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "index.html";
      a.click();
      URL.revokeObjectURL(url);
    }

    userInput.addEventListener("keydown", e => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
