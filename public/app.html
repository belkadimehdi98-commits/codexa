<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Codexa Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="center">
  <h1>⚡ Codexa AI Generator</h1>
  <textarea id="prompt" placeholder="Describe your site idea..."></textarea>
  <br>
  <button id="generateBtn" class="btn btn-blue">Get Your Code Now</button>
  <p id="status"></p>

  <!-- Results -->
  <pre id="resultBox" style="display:none; text-align:left; background:#161b22; padding:1rem; border-radius:6px; max-width:90%; overflow-x:auto;"></pre>

  <!-- Actions -->
  <div id="actions" style="display:none; margin-top:1rem;">
    <button id="copyBtn" class="btn btn-purple">Copy Code</button>
    <button id="downloadBtn" class="btn btn-green">Download as File</button>
  </div>

  <script>
    document.getElementById("generateBtn").addEventListener("click", async () => {
      const prompt = document.getElementById("prompt").value;
      document.getElementById("status").textContent = "⏳ Generating...";

      const res = await fetch("/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt })
      });

      if (res.ok) {
        const data = await res.json();
        document.getElementById("status").textContent = "✅ Done!";
        document.getElementById("resultBox").style.display = "block";
        document.getElementById("resultBox").textContent = data.code;
        document.getElementById("actions").style.display = "block";

        // Copy button
        document.getElementById("copyBtn").onclick = () => {
          navigator.clipboard.writeText(data.code);
          alert("Code copied to clipboard!");
        };

        // Download button
        document.getElementById("downloadBtn").onclick = () => {
          const blob = new Blob([data.code], { type: "text/html" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "codexa_project.html";
          a.click();
          URL.revokeObjectURL(url);
        };
      } else {
        document.getElementById("status").textContent = "❌ Error generating code.";
      }
    });
  </script>
</body>
</html>
