<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codexa AI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: #fff;
      margin: 0;
      padding: 0;
    }
    header {
      background: #161b22;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      margin: 0;
      color: #fff;
    }
    .chat-container {
      height: 80vh;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }
    .msg {
      padding: 10px;
      border-radius: 8px;
      margin: 5px 0;
      max-width: 75%;
      line-height: 1.4em;
    }
    .user {
      background: #2563eb;
      color: #fff;
      align-self: flex-end;
    }
    .ai {
      background: #1f2937;
      color: #fff;
      align-self: flex-start;
      position: relative;
    }
    .typing {
      font-style: italic;
      opacity: 0.7;
    }
    footer {
      background: #161b22;
      padding: 10px;
      display: flex;
      gap: 10px;
    }
    input {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: none;
    }
    button {
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .chat-btn {
      background: #22c55e;
      color: white;
    }
  </style>
</head>
<body>
  <header>
    <h1>⚡ Codexa AI</h1>
    <nav>
      <a href="index.html" style="color:white; margin-right:15px;">Home</a>
      <a href="tutorial.html" style="color:white;">Tutorial</a>
    </nav>
  </header>

  <main class="chat-container" id="chat"></main>

  <footer>
    <input id="userInput" type="text" placeholder="Type your message..." />
    <button class="chat-btn" onclick="sendMessage()">Chat</button>
  </footer>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("userInput");

    function addMessage(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      addMessage(text, "user");
      input.value = "";

      // Add AI placeholder
      const aiMsg = addMessage("typing...", "ai typing");

      // Open SSE stream
      const evtSource = new EventSource(`/chat-stream?prompt=${encodeURIComponent(text)}`);
      aiMsg.textContent = ""; // clear "typing..."

      evtSource.onmessage = function (event) {
        if (event.data === "[DONE]") {
          evtSource.close();
          return;
        }
        try {
          const parsed = JSON.parse(event.data);
          if (parsed.token) {
            aiMsg.textContent += parsed.token;
            chat.scrollTop = chat.scrollHeight;
          }
        } catch (err) {
          console.error("Stream parse error:", err);
        }
      };

      evtSource.onerror = function () {
        evtSource.close();
        aiMsg.textContent += "\n[Error receiving response]";
      };
    }

    // Allow pressing Enter to send
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
