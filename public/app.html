<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codexa AI App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-left">
      <img src="assets/logo.png" alt="Codexa Logo" class="logo">
      <span class="brand">Codexa AI</span>
    </div>
    <div class="nav-right">
      <a href="index.html">Home</a>
      <a href="index.html#features">Features</a>
      <a href="index.html#pricing">Pricing</a>
    </div>
  </nav>

  <!-- Chat Section -->
  <section class="chat-section">
    <div class="chat-box" id="chat-box">
      <div class="chat-message bot">Hello! How can I assist you today?</div>
    </div>
    <div class="chat-input">
      <input type="text" id="user-input" placeholder="Type your message...">
      <button class="btn chat-btn">Chat</button>
      <button class="btn generate-btn">Generate Code</button>
    </div>
    <div class="chat-buttons">
      <button class="copy-btn">📋 Copy</button>
      <button class="download-btn">⬇️ Download</button>
      <button class="export-btn">📂 Export Chat</button>
      <button class="reset-btn">🔄 Reset</button>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>© 2025 Codexa AI. All rights reserved.</p>
  </footer>
</body>
</html>
