<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codexa AI App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Navbar -->
  <header class="navbar">
    <div class="logo">
      <img src="codexa-logo.png" alt="Codexa Logo" />
      <span>Codexa AI</span>
    </div>
    <nav>
      <a href="/">Home</a>
      <a href="index.html#features">Features</a>
      <a href="index.html#pricing">Pricing</a>
    </nav>
  </header>

  <!-- Chat App -->
  <main class="chat-container">
    <div id="chat-box" class="chat-box"></div>
    <div class="chat-input">
      <input type="text" id="user-input" placeholder="Type your message..." />
      <button id="send-btn" class="btn primary">Chat</button>
      <button id="gen-btn" class="btn secondary">Generate Code</button>
    </div>
    <div class="chat-tools">
      <button class="btn tool">Copy</button>
      <button class="btn tool">Download</button>
      <button class="btn tool">Export Chat</button>
      <button class="btn tool">Reset</button>
    </div>
  </main>

  <footer>
    <p>© 2025 Codexa AI. All rights reserved.</p>
  </footer>
</body>
</html>
