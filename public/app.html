<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codexa | AI Generator</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #0d1117;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header.navbar {
      background: #161b22;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header .logo {
      font-weight: bold;
      font-size: 1.3rem;
    }
    header nav a {
      color: #fff;
      margin-left: 1rem;
      text-decoration: none;
      font-size: 1rem;
    }
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1rem;
      overflow: hidden;
    }
    .chat-box {
      flex: 1;
      background: #161b22;
      border-radius: 8px;
      padding: 1rem;
      overflow-y: auto;
      margin-bottom: 1rem;
    }
    .message {
      margin: 0.5rem 0;
      padding: 0.6rem 1rem;
      border-radius: 6px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .user-message {
      background: #3b82f6;
      color: #fff;
      text-align: right;
    }
    .ai-message {
      background: #1e2633;
      color: #fff;
      text-align: left;
    }
    .chat-input {
      display: flex;
      gap: 0.5rem;
    }
    textarea {
      flex: 1;
      resize: none;
      padding: 0.6rem;
      border-radius: 6px;
      border: none;
      outline: none;
      background: #161b22;
      color: #fff;
      font-size: 1rem;
    }
    button {
      padding: 0.6rem 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }
    #send-btn { background: #22c55e; color: #fff; }
    #generate-btn { background: #a855f7; color: #fff; }
    footer {
      background: #161b22;
      padding: 1rem;
      text-align: center;
      color: #aaa;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="navbar">
    <div class="logo">⚡ Codexa AI</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="tutorial.html">Tutorial</a>
    </nav>
  </header>

  <!-- Chat Section -->
  <main class="chat-container">
    <div id="chat-box" class="chat-box"></div>
    <div class="chat-input">
      <textarea id="user-input" placeholder="Type your message... (Enter = send, Shift+Enter = new line)"></textarea>
      <button id="send-btn">💬 Chat</button>
      <button id="generate-btn">💻 Generate Code</button>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    © 2025 Codexa. All rights reserved.
  </footer>

  <!-- Script -->
  <script src="script.js"></script>
</body>
</html>
