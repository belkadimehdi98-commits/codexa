<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Codexa | AI Generator</title>
  <style>
    :root{
      --bg:#0d1117; --panel:#161b22; --ai:#1e2633; --user:#2563eb; --text:#fff; --muted:#aab1ba;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column;height:100vh}
    header{background:var(--panel);padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
    header img{height:34px}
    header nav a{color:#fff;text-decoration:none;margin-left:16px}
    main{flex:1;display:flex;flex-direction:column;max-width:980px;margin:0 auto;width:100%}
    #messages{flex:1;overflow:auto;padding:18px}
    .bubble{max-width:80%;padding:12px 14px;border-radius:12px;line-height:1.5;margin:6px 0;position:relative;white-space:pre-wrap;word-wrap:break-word}
    .row{display:flex;flex-direction:column;margin-bottom:10px}
    .label{font-size:.8rem;color:var(--muted);margin:2px 4px 6px}
    .ai .label{align-self:flex-start}
    .user .label{align-self:flex-end}
    .ai .bubble{background:var(--ai);align-self:flex-start}
    .user .bubble{background:var(--user);align-self:flex-end}
    .bubble pre{background:#0b0f14;border:1px solid #222;border-radius:8px;padding:10px;overflow:auto}
    .code-actions{margin-top:6px;display:flex;gap:8px}
    .code-actions button{padding:6px 10px;border:none;border-radius:6px;cursor:pointer;font-weight:600}
    footer{background:var(--panel);display:flex;gap:10px;align-items:center;padding:12px 16px}
    #prompt{flex:1;min-height:44px;max-height:160px;resize:vertical;border:none;border-radius:8px;background:#1e2633;color:#fff;padding:10px 12px;font-size:1rem;outline:none}
    .btn{padding:10px 14px;border:none;border-radius:8px;font-weight:700;cursor:pointer}
    .btn-blue{background:#3b82f6;color:#fff}
    .btn-green{background:#22c55e;color:#fff}
    .floating{position:fixed;right:20px;bottom:90px;display:none;box-shadow:0 6px 24px rgba(0,0,0,.35)}
    .typing{color:var(--muted);font-style:italic}
  </style>
</head>
<body>
  <header>
    <img src="/logo.png" alt="Codexa Logo">
    <nav>
      <a href="/tutorial.html">Tutorial</a>
    </nav>
  </header>

  <main>
    <div id="messages"></div>
  </main>

  <footer>
    <textarea id="prompt" placeholder="Type your message… (Enter = send, Shift+Enter = new line)"></textarea>
    <button id="sendBtn" class="btn btn-blue">💬 Chat</button>
  </footer>

  <button id="generateBtn" class="btn btn-green floating">💻 Generate Code</button>

  <script>
    const messagesEl = document.getElementById('messages');
    const promptEl = document.getElementById('prompt');
    const sendBtn  = document.getElementById('sendBtn');
    const genBtn   = document.getElementById('generateBtn');

    let lastAIMessage = "";   // last full AI message text (to convert into a code block if needed)

    // Helpers
    function rowEl(kind){ const r=document.createElement('div'); r.className=`row ${kind}`; return r; }
    function labelEl(text){ const l=document.createElement('div'); l.className='label'; l.textContent=text; return l; }
    function bubbleEl(){ const b=document.createElement('div'); b.className='bubble'; return b; }

    function addUserMessage(text){
      const r = rowEl('user');
      r.appendChild(labelEl('You'));
      const b = bubbleEl(); b.textContent = text; r.appendChild(b);
      messagesEl.appendChild(r); messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addAIMessageContainer(){
      const r = rowEl('ai');
      r.appendChild(labelEl('💡 Codexa AI'));
      const b = bubbleEl(); b.innerHTML = '<span class="typing">typing…</span>';
      r.appendChild(b);
      messagesEl.appendChild(r); messagesEl.scrollTop = messagesEl.scrollHeight;
      return b;
    }

    function showAIMessage(html){
      // Replace the current last AI bubble content
      const rows = [...messagesEl.querySelectorAll('.row.ai .bubble')];
      const last = rows[rows.length-1];
      if (last) last.innerHTML = html;
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function looksLikeCode(s){
      return /<!DOCTYPE|<html|<head|<body|<script|<style|<\/?div|function\s+\w+\s*\(|const\s+\w+\s*=|class\s+\w+/.test(s);
    }

    function toCodeBlock(text){
      // Wrap into <pre> and add inline actions
      const safe = text.replace(/<\/script>/gi,'</scr'+'ipt>');
      return `
        <pre>${safe}</pre>
        <div class="code-actions">
          <button onclick="navigator.clipboard.writeText(\`${safe}\`)">📋 Copy</button>
          <button onclick="(function(){
            const blob=new Blob([\`${safe}\`],{type:'text/html'});
            const url=URL.createObjectURL(blob);
            const a=document.createElement('a'); a.href=url; a.download='index.html'; a.click(); URL.revokeObjectURL(url);
          })()">⬇️ Download</button>
        </div>
      `;
    }

    function sendMessage(){
      const text = promptEl.value.trim();
      if(!text) return;
      promptEl.value = '';
      addUserMessage(text);

      const bubble = addAIMessageContainer();
      bubble.innerHTML = '<span class="typing">typing…</span>';

      lastAIMessage = "";

      const src = new EventSource(`/chat-stream?prompt=${encodeURIComponent(text)}`);
      src.onmessage = (evt)=>{
        try{
          const data = JSON.parse(evt.data);
          if(data.token){
            lastAIMessage += data.token;
            // live render (plain text while streaming)
            bubble.textContent = lastAIMessage;
          }
        }catch{}
        messagesEl.scrollTop = messagesEl.scrollHeight;
      };
      src.addEventListener('done', ()=>{
        src.close();
        // Final render: if it's code → reveal Generate button and show hint
        if(looksLikeCode(lastAIMessage)){
          genBtn.style.display = 'inline-block';
          // keep message as plain text until user clicks "Generate Code" (for a clean, intentional action)
          bubble.textContent = lastAIMessage;
          // gentle hint
          const hint = rowEl('ai');
          hint.appendChild(labelEl('💡 Codexa AI'));
          const hb = bubbleEl();
          hb.textContent = "Tip: Click “💻 Generate Code” to save this as a file (copy/download).";
          hint.appendChild(hb);
          messagesEl.appendChild(hint);
        }
      });
      src.onerror = ()=> src.close();
    }

    // Enter / Shift+Enter behavior
    promptEl.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        sendMessage();
      }
    });
    sendBtn.addEventListener('click', sendMessage);

    // Generate button: convert the last AI message to a code block with inline copy/download
    genBtn.addEventListener('click', ()=>{
      if(!lastAIMessage) return;
      const r = rowEl('ai');
      r.appendChild(labelEl('💡 Codexa AI'));
      const b = bubbleEl();
      b.innerHTML = toCodeBlock(lastAIMessage);
      r.appendChild(b);
      messagesEl.appendChild(r);
      genBtn.style.display = 'none';
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });
  </script>
</body>
</html>
