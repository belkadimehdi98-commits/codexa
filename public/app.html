<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codexa AI App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Navbar -->
  <header class="navbar">
    <div class="logo-container">
      <img src="assets/logo.png" alt="Codexa Logo" class="logo">
      <span class="brand">Codexa AI</span>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="index.html#features">Features</a>
      <a href="index.html#pricing">Pricing</a>
    </nav>
  </header>

  <!-- Chat App -->
  <main class="chat-layout">
    <div id="chat-container">
      <!-- Messages will appear here -->
    </div>

    <!-- Controls always visible -->
    <div id="controls">
      <input type="text" id="user-input" placeholder="Type your message..." />
      <button id="chat-btn" class="btn-green">Chat</button>
      <button id="gen-btn" class="btn-blue">Generate Code</button>
    </div>

    <!-- Extra buttons above footer -->
    <div id="chat-actions">
      <button class="btn-dark">Copy</button>
      <button class="btn-dark">Download</button>
      <button class="btn-dark">Export Chat</button>
      <button class="btn-dark">Reset</button>
    </div>
  </main>

  <footer>
    <p>© 2025 Codexa AI. All rights reserved.</p>
  </footer>
</body>
</html>
