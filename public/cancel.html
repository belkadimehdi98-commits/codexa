<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Canceled | Codexa</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e293b, #334155, #0f172a);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #111827;
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      max-width: 500px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }
    h1 {
      color: #ef4444;
    }
    p {
      margin: 15px 0;
      line-height: 1.6;
    }
    a {
      display: inline-block;
      margin-top: 20px;
      background: #f59e0b;
      padding: 12px 24px;
      border-radius: 8px;
      color: #fff;
      text-decoration: none;
      transition: background 0.3s;
    }
    a:hover {
      background: #d97706;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>❌ Payment Canceled</h1>
    <p>Your subscription process was canceled.  
    Don’t worry, you can try again anytime.</p>
    <a href="index.html">Return to Codexa</a>

</html>
