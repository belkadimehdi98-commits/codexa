<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Codexa Chat</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">
      <img src="images/logo.png" alt="Codexa Logo">
      <span>Codexa</span>
    </div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="index.html#features">Features</a></li>
      <li><a href="index.html#pricing">Pricing</a></li>
      <li><a href="tutorial.html">Tutorials</a></li>
      <li><button id="theme-toggle" class="theme-toggle">🌙</button></li>
    </ul>
  </nav>

  <!-- Chat Container -->
  <main class="chat-container">
    <h2 class="chat-header">💬 Codexa AI Assistant</h2>

    <!-- Mode Toggle -->
    <div class="mode-toggle">
      <button id="chat-mode" class="mode-btn active">💬 Chat</button>
      <button id="code-mode" class="mode-btn">📘 Code</button>
      <button id="image-mode" class="mode-btn">🖼️ Image</button>
    </div>

    <!-- Chat Box -->
    <div id="chat-box" class="chat-box">
      <div class="message bot">Hello! I can chat, generate code, and create images. What do you need?</div>
    </div>

    <!-- Chat Form -->
    <form id="chat-form" class="chat-form">
      <input type="text" id="user-input" placeholder="Ask Codexa...">
      <button type="submit">Send</button>
    </form>
  </main>

  <footer>
    <p>© 2025 Codexa. All rights reserved.</p>
  </footer>

  <script src="chat.js"></script>
  <script src="theme.js"></script>
</body>
</html>
