<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codexa — AI Coding Assistant</title>
  <link rel="stylesheet" href="chat.css" />
  <link rel="icon" href="favicon.ico" />
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <h1>💻 Codexa Assistant</h1>
    </header>

    <main id="chat-box" class="chat-box">
      <!-- Messages will be injected here -->
    </main>

    <form id="chat-form" class="chat-form">
      <input 
        type="text" 
        id="user-input" 
        placeholder="Type your code request..." 
        autocomplete="off"
        required
      />
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    const form = document.getElementById("chat-form");
    const input = document.getElementById("user-input");
    const chatBox = document.getElementById("chat-box");

    function appendMessage(sender, text) {
      const msg = document.createElement("div");
      msg.className = `message ${sender}`;
      msg.innerHTML = `<p>${text}</p>`;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      appendMessage("user", text);
      input.value = "";

      appendMessage("loading", "⏳ Thinking...");

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text }),
        });
        const data = await res.json();

        // remove loading
        const loadingMsg = document.querySelector(".message.loading");
        if (loadingMsg) loadingMsg.remove();

        appendMessage("bot", data.reply || "⚠️ No response");
      } catch (err) {
        const loadingMsg = document.querySelector(".message.loading");
        if (loadingMsg) loadingMsg.remove();
        appendMessage("bot", "❌ Error connecting to Codexa API.");
      }
    });
  </script>
</body>
</html>
