<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Codexa Chat</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">
      <img src="images/logo.png" alt="Codexa Logo" />
      <span>Codexa</span>
    </div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="index.html#features">Features</a></li>
      <li><a href="index.html#pricing">Pricing</a></li>
      <li><a href="tutorials.html">Tutorials</a></li>
    </ul>
  </nav>

  <!-- Chat -->
  <main class="chat-container">
    <div class="chat-header">💬 Codexa AI Assistant</div>

    <!-- Mode buttons -->
    <div class="chat-modes">
      <button class="mode-btn active" data-mode="chat">💬 Chat</button>
      <button class="mode-btn" data-mode="code">💻 Code</button>
      <button class="mode-btn" data-mode="image">🖼️ Image</button>
    </div>

    <!-- Chat messages -->
    <div id="chat-box" class="chat-box"></div>

    <!-- Input form -->
    <form id="chat-form" class="chat-form">
      <input type="text" id="user-input" placeholder="Ask Codexa..." required />
      <button type="submit">Send</button>
    </form>
  </main>

  <footer>
    <p>© 2025 Codexa. All rights reserved.</p>
  </footer>

  <script src="chat.js"></script>
</body>
</html>
