<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout - Codexa AI</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://js.stripe.com/v3/"></script>
</head>
<body>
  <header class="navbar">
    <div class="logo">
      <img src="logo.png" alt="Codexa Logo" />
      <span>Codexa AI</span>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="index.html#pricing">Pricing</a>
      <a href="app.html">Open App</a>
    </nav>
  </header>

  <section class="checkout">
    <h2>Upgrade Your Plan</h2>
    <p>Select a plan and complete payment securely.</p>
    <div class="plans">
      <div class="plan-card">
        <h3>Pro Plan</h3>
        <p>Unlimited generations</p>
        <button id="checkout-pro" class="btn-primary">Subscribe Pro</button>
      </div>
      <div class="plan-card">
        <h3>Team Plan</h3>
        <p>Collaboration & support</p>
        <button id="checkout-team" class="btn-primary">Subscribe Team</button>
      </div>
    </div>
  </section>

  <footer>
    <p>© 2025 Codexa AI. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
