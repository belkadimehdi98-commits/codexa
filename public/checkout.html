<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Codexa AI</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://js.stripe.com/v3/"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <header>
    <img src="logo.png" alt="Codexa Logo" class="logo">
    <nav>
      <a href="index.html">Home</a>
      <a href="pricing.html">Pricing</a>
      <a href="app.html">Open App</a>
    </nav>
  </header>

  <main class="checkout-page">
    <h1>Upgrade Your Plan</h1>
    <p>Select a plan and complete payment securely.</p>

    <div class="pricing-cards">
      <div class="card">
        <h3>Pro Plan</h3>
        <p>Unlimited generations</p>
        <button id="checkout-pro" class="btn">Subscribe Pro</button>
      </div>
      <div class="card">
        <h3>Team Plan</h3>
        <p>Collaboration & support</p>
        <button id="checkout-team" class="btn secondary">Subscribe Team</button>
      </div>
    </div>
  </main>

  <footer>© 2025 Codexa AI. All rights reserved.</footer>
</body>
</html>
