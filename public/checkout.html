<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Codexa AI</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://js.stripe.com/v3/"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <img src="logo.png" alt="Codexa Logo" class="logo">
    <span class="brand">Codexa AI</span>
    <nav>
      <a href="index.html">Home</a>
      <a href="pricing.html">Pricing</a>
      <a href="app.html">Open App</a>
    </nav>
  </header>

  <main>
    <section class="pricing">
      <h2>Upgrade Your Plan</h2>
      <p>Select a plan and complete payment securely.</p>
      <div class="pricing-cards">
        <div class="card">
          <h3>Pro Plan</h3>
          <p>Unlimited generations</p>
          <button onclick="redirectToCheckout('pro')" class="btn btn-primary">Subscribe Pro</button>
        </div>

        <div class="card">
          <h3>Team Plan</h3>
          <p>Collaboration & support</p>
          <button onclick="redirectToCheckout('team')" class="btn btn-primary">Subscribe Team</button>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2025 Codexa AI. All rights reserved.</p>
  </footer>
</body>
</html>
