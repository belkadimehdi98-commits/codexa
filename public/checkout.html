<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codexa AI - Checkout</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo">
        <img src="logo.png" alt="Codexa AI Logo" />
        <h1>Codexa AI</h1>
      </div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="features.html">Features</a></li>
        <li><a href="pricing.html">Pricing</a></li>
      </ul>
    </nav>
  </header>

  <main class="checkout">
    <h2>Complete Your Plan</h2>
    <p>Click below to proceed with a secure payment.</p>
    <button id="payButton" class="btn">Pay Now</button>
  </main>

  <footer>
    <p>© 2025 Codexa AI. All rights reserved.</p>
  </footer>

  <script>
    document.getElementById("payButton").addEventListener("click", async () => {
      const params = new URLSearchParams(window.location.search);
      const plan = params.get("plan");
      let priceId = "";

      if (plan === "pro") priceId = "price_pro"; // replace with your Stripe price ID
      if (plan === "team") priceId = "price_team"; // replace with your Stripe price ID

      const res = await fetch("/create-checkout-session", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ priceId })
      });

      const data = await res.json();
      if (data.url) window.location = data.url;
      else alert("Error creating checkout session.");
    });
  </script>
</body>
</html>
