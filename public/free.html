<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codexa Free Plan</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .free-container {
      max-width: 700px;
      margin: 5rem auto;
      text-align: center;
      background: #161b22;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
    }
    .free-container h1 {
      color: #2ea043;
      margin-bottom: 1rem;
    }
    .free-container p {
      margin-bottom: 2rem;
      font-size: 1.1rem;
    }
    .btn-back {
      background: #2ea043;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.3s;
    }
    .btn-back:hover {
      background: #248a3d;
    }
  </style>
</head>
<body>
  <div class="free-container">
    <h1>🎉 Welcome to Codexa Free Plan!</h1>
    <p>You can now try Codexa with limited generations. Ready to start coding?</p>
    <a href="chat.html" class="btn-back">Go to Chat</a>
  </div>
</body>
</html>
