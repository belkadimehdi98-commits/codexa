<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codexa</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
</head>
<body class="bg-gray-50 text-gray-800">

  <header class="p-6 flex justify-between items-center bg-white shadow">
    <img src="logo.png" alt="Codexa Logo" class="h-10">
    <nav>
      <button id="start-free" class="px-4 py-2 bg-blue-500 text-white rounded-lg mr-2">Start Free</button>
      <button id="pro-plan" class="px-4 py-2 bg-green-500 text-white rounded-lg mr-2">Upgrade to Pro</button>
      <button id="team-plan" class="px-4 py-2 bg-purple-500 text-white rounded-lg">Get Team Plan</button>
    </nav>
  </header>

  <main class="max-w-3xl mx-auto text-center py-20">
    <h1 class="text-4xl font-bold mb-6">Welcome to Codexa</h1>
    <p class="mb-6 text-lg">Your AI-powered coding assistant.</p>

    <button id="generate-code" class="px-6 py-3 bg-indigo-600 text-white rounded-lg shadow-lg">
      ⚡ Generate Code Now
    </button>
  </main>

  <script>
    const PUBLIC_KEY = "pk_live_51SEW0g50pz2SntAR9AD7gJop6Ld4LgZVVve4enxE7GkyD8mV4RaAm6tOaovxtWBMMQXfOrPopueiXya0R5nMTSVJ00PJ7m7y3v";

    document.getElementById("start-free").addEventListener("click", () => {
      window.location.href = "/free.html";
    });

    async function checkout(priceId) {
      const res = await fetch("/create-checkout-session", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ priceId })
      });
      const data = await res.json();
      if (data.url) window.location.href = data.url;
    }

    document.getElementById("pro-plan").addEventListener("click", () => {
      checkout("prod_TBcbJUfyISCnWg");
    });

    document.getElementById("team-plan").addEventListener("click", () => {
      checkout("prod_TBceBoDcVSuXas");
    });

    document.getElementById("generate-code").addEventListener("click", () => {
      alert("AI Code Generator coming soon! 🚀");
    });
  </script>
</body>
</html>
