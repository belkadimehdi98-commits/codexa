<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Codexa – AI Coding Assistant</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
      color: #fff;
      text-align: center;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: rgba(0,0,0,0.2);
    }
    header img {
      height: 40px;
    }
    header nav button {
      margin-left: 10px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-free { background: #00c3ff; color: #000; }
    .btn-pro { background: #00ff99; color: #000; }
    .btn-team { background: #a64dff; color: #fff; }
    .hero {
      margin-top: 50px;
    }
    .hero h1 {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }
    .plans {
      display: flex;
      justify-content: center;
      margin: 3rem auto;
      gap: 1.5rem;
    }
    .plan-card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 12px;
      width: 250px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    .plan-card h2 { margin-bottom: 0.5rem; }
    .plan-card p { margin: 0.5rem 0; }
    .plan-card button {
      margin-top: 1rem;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .generator {
      background: #0f172a;
      margin: 2rem auto;
      padding: 2rem;
      border-radius: 12px;
      width: 600px;
      max-width: 90%;
    }
    textarea {
      width: 100%;
      height: 120px;
      border-radius: 8px;
      border: none;
      padding: 1rem;
      font-size: 1rem;
    }
    .generator button {
      margin: 10px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-generate { background: #00c3ff; color: #000; }
    .btn-copy { background: #ff9800; color: #fff; }
    .btn-download { background: #4caf50; color: #fff; }
    #output {
      background: #111827;
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 8px;
      text-align: left;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Codexa Logo"/>
    <nav>
      <button class="btn-free" onclick="window.location.href='free.html'">Start Free</button>
      <button class="btn-pro" onclick="checkout('price_1SFFMf50pz2SntAR9RG9WteF')">Upgrade to Pro</button>
      <button class="btn-team" onclick="checkout('price_1SFFP950pz2SntARpYHyaZEi')">Get Team Plan</button>
    </nav>
  </header>

  <div class="hero">
    <h1>Welcome to Codexa</h1>
    <p>Your AI-powered coding assistant</p>
  </div>

  <section class="plans">
    <div class="plan-card">
      <h2>Free Plan</h2>
      <p>Great for starters</p>
      <h3>€0</h3>
      <button class="btn-free" onclick="window.location.href='free.html'">Start Free</button>
    </div>
    <div class="plan-card">
      <h2>Pro Plan</h2>
      <p>For professionals</p>
      <h3>€19.99 / month</h3>
      <button class="btn-pro" onclick="checkout('price_1SFFMf50pz2SntAR9RG9WteF')">Upgrade to Pro</button>
    </div>
    <div class="plan-card">
      <h2>Team Plan</h2>
      <p>Collaborate better</p>
      <h3>€49.99 / month</h3>
      <button class="btn-team" onclick="checkout('price_1SFFP950pz2SntARpYHyaZEi')">Get Team Plan</button>
    </div>
  </section>

  <section class="generator">
    <h2>🚀 AI Code Generator</h2>
    <p>Describe the code you want, and AI will generate it for you:</p>
    <textarea id="prompt" placeholder="Type your request..."></textarea>
    <br/>
    <button class="btn-generate" onclick="generateCode()">⚡ Generate Code Now</button>
    <button class="btn-copy" onclick="copyCode()">📋 Copy Code</button>
    <button class="btn-download" onclick="downloadCode()">📥 Download File</button>
    <div id="output">Generated code will appear here...</div>
  </section>

  <script>
    // Stripe checkout
    async function checkout(priceId) {
      const response = await fetch("/create-checkout-session", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ priceId })
      });
      const data = await response.json();
      if (data.url) {
        window.location.href = data.url;
      } else {
        alert("Error: " + data.error);
      }
    }

    // AI Code generation
    async function generateCode() {
      const prompt = document.getElementById("prompt").value;
      const res = await fetch("/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt })
      });
      const data = await res.json();
      document.getElementById("output").innerText = data.code || data.error;
    }

    // Copy code
    function copyCode() {
      const text = document.getElementById("output").innerText;
      navigator.clipboard.writeText(text);
      alert("Code copied to clipboard!");
    }

    // Download code
    function downloadCode() {
      const text = document.getElementById("output").innerText;
      const blob = new Blob([text], { type: "text/plain" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "codexa_code.txt";
      link.click();
    }
  </script>
</body>
</html>
