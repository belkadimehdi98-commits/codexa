<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codexa | AI Code Generator</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b, #334155);
      color: #f8fafc;
    }
    header {
      background: #111827;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.4);
    }
    header h1 {
      margin: 0;
      color: #3b82f6;
    }
    header nav a {
      color: #f8fafc;
      margin-left: 20px;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s;
    }
    header nav a:hover {
      color: #3b82f6;
    }
    .hero {
      text-align: center;
      padding: 80px 20px;
    }
    .hero h2 {
      font-size: 2.5rem;
      margin-bottom: 20px;
      color: #f8fafc;
    }
    .hero p {
      font-size: 1.2rem;
      color: #d1d5db;
      margin-bottom: 40px;
    }
    .hero .btn {
      display: inline-block;
      margin: 10px;
      padding: 14px 30px;
      border-radius: 8px;
      font-weight: bold;
      text-decoration: none;
      transition: background 0.3s;
    }
    .btn-free {
      background: #22c55e;
      color: #fff;
    }
    .btn-free:hover {
      background: #16a34a;
    }
    .btn-pro {
      background: #3b82f6;
      color: #fff;
    }
    .btn-pro:hover {
      background: #2563eb;
    }
    .btn-team {
      background: #9333ea;
      color: #fff;
    }
    .btn-team:hover {
      background: #7e22ce;
    }
    footer {
      background: #111827;
      padding: 20px;
      text-align: center;
      color: #9ca3af;
      margin-top: 60px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Codexa</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="free.html">Free</a>
    </nav>
  </header>

  <section class="hero">
    <h2>⚡ AI Code Generator</h2>
    <p>Generate production-ready code in seconds. Choose your plan below.</p>
    <a href="free.html" class="btn btn-free">Start Free</a>
    <a href="#" id="pro-btn" class="btn btn-pro">Upgrade to Pro</a>
    <a href="#" id="team-btn" class="btn btn-team">Get Team Plan</a>
  </section>

  <footer>
    <p>© 2025 Codexa. All rights reserved.</p>
  </footer>

  <script>
    // Stripe checkout handler
    async function createCheckout(priceId) {
      const res = await fetch("/create-checkout-session", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ priceId }),
      });
      const data = await res.json();
      if (data.url) {
        window.location.href = data.url;
      } else {
        alert("Something went wrong: " + data.error);
      }
    }

    document.getElementById("pro-btn").addEventListener("click", () => {
      createCheckout("{{PRO_PRICE_ID}}"); // Replace with env or inject
    });

    document.getElementById("team-btn").addEventListener("click", () => {
      createCheckout("{{TEAM_PRICE_ID}}"); // Replace with env or inject
    });
  </script>
</body>
</html>
