<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Codexa Tutorials</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">
      <img src="images/logo.png" alt="Codexa Logo" />
      <span>Codexa</span>
    </div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="index.html#features">Features</a></li>
      <li><a href="index.html#pricing">Pricing</a></li>
      <li><a href="chat.html">Chat</a></li>
    </ul>
  </nav>

  <!-- Tutorials container -->
  <main class="chat-container">
    <div class="chat-header">📘 Codexa Tutorials</div>

    <!-- Scrollable tutorial box -->
    <div class="chat-box" id="tutorial-box">
      <p class="message bot">👋 Ask me for a tutorial, like:<br>
      - "Build a landing page in React"<br>
      - "Learn CSS Flexbox basics"<br>
      - "How to connect Node.js with PostgreSQL"</p>
    </div>

    <!-- Fixed form at bottom of container -->
    <form id="tutorial-form" class="chat-form">
      <input type="text" id="tutorial-input" placeholder="Ask Codexa for a tutorial..." required />
      <button type="submit">Generate</button>
    </form>
  </main>

  <footer>
    <p>© 2025 Codexa. All rights reserved.</p>
  </footer>

  <script src="tutorials.js"></script>
</body>
</html>
